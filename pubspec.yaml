name: aira
description: "An open-source custom controller app for Huawei Earbuds."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0
  material_ui: ^1.11.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  path: ^1.9.1
  tray_manager: ^0.9.0
  window_manager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/devices/
    - assets/scripts/
